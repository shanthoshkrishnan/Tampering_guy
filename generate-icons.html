<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h2>Load Master Icon Generator</h2>
    <canvas id="canvas192" width="192" height="192" style="border:1px solid black"></canvas>
    <canvas id="canvas512" width="512" height="512" style="border:1px solid black"></canvas>
    <br><br>
    <button onclick="download()">Download Icons</button>

    <script>
        function createIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#4f46e5');
            gradient.addColorStop(1, '#7c3aed');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // White text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚖️', size / 2, size / 2);
            
            // App name
            ctx.font = `bold ${size * 0.08}px Arial`;
            ctx.fillText('Load Master', size / 2, size * 0.8);
        }

        createIcon(document.getElementById('canvas192'), 192);
        createIcon(document.getElementById('canvas512'), 512);

        function download() {
            const canvas192 = document.getElementById('canvas192');
            const canvas512 = document.getElementById('canvas512');
            
            canvas192.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'pwa-192x192.png';
                a.click();
            });
            
            setTimeout(() => {
                canvas512.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'pwa-512x512.png';
                    a.click();
                });
            }, 500);
        }
    </script>
</body>
</html>
